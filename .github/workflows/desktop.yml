# Builds the Windows installer (Fairway-Studio-Setup.exe) on a Windows machine.
# Pull requests: build only, downloadable from the run's Artifacts.
# Pushes to main: also publish it as the latest GitHub Release, which the in-app
# "Download for Windows" button links to:
#   https://github.com/jafar-pixel/Fairway-Studio/releases/latest/download/Fairway-Studio-Setup.exe
name: Windows app

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Fairway-Studio-Setup
          path: desktop/dist/Fairway-Studio-Setup.exe
          if-no-files-found: error
      - name: Read app version
        if: github.event_name != 'pull_request'
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: Fairway Studio for Windows ${{ steps.version.outputs.version }}
          make_latest: "true"
          body: |
            Download **Fairway-Studio-Setup.exe** below and run it to install Fairway Studio on Windows.
            Windows may show "Windows protected your PC" because the installer isn't code-signed yet: choose **More info → Run anyway**.
            The app always opens the live studio, so new features arrive without reinstalling.
          files: desktop/dist/Fairway-Studio-Setup.exe
