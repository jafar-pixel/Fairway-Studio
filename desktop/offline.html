<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Fairway Studio</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f3ed; color: #1c1917; font-family: system-ui, "Segoe UI", sans-serif; }
    main { max-width: 420px; padding: 32px; text-align: center; }
    p.eyebrow { color: #760d24; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; }
    h1 { font-size: 24px; margin: 8px 0 12px; }
    p { color: #57534e; line-height: 1.5; }
    button { margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 10px; background: #760d24; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #590a1b; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Fairway Studio</p>
    <h1>You're offline</h1>
    <p>Fairway Studio needs an internet connection. Check your connection, then try again.</p>
    <button type="button" onclick="window.fairwayDesktop && window.fairwayDesktop.retry()">Try again</button>
  </main>
</body>
</html>
